# Versions are the newest stable releases compatible with the Gradle 8.14 wrapper:
#  - AGP 8.13.x is the last line that runs on Gradle 8 (AGP 9 needs Gradle 9.1+).
#  - Kotlin 2.3.x is the newest line whose metadata the R8 bundled with AGP 8.13.2 understands
#    (Kotlin 2.4 needs R8 9.1+), and KGP 2.3.21 officially supports AGP 8.13 and Gradle 8.14.
#  - Compose 1.12+ (BOM 2026.08+) and Lifecycle 2.11+ compile against API 37 and need AGP 9.2,
#    so the Compose BOM stays on the 1.11 line (2026.06.01) and Lifecycle on 2.10.
#  - androidx.core 1.18+ / activity 1.13+ require compileSdk 36.1; we compile against 36.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.11.0"
junit = "5.14.4"
okhttp = "5.5.0"
androidx-core = "1.17.0"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.10.0"
compose-bom = "2026.06.01"

[libraries]
# Build logic: put on the root buildscript classpath (see ../build.gradle.kts) and applied by id,
# without a version, in the modules, so the Kotlin and Android plugins share one class loader.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-composeCompilerPlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# :protocol
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# :app
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
