# Weekly update checks. Security updates are opened as soon as an advisory is
# published, whatever this schedule says.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /companion-android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
