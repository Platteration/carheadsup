name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: node_modules/.cache/carheadsup-e2e
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deployment kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/check.sh

  android-protocol:
    name: Android protocol module
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Build only the pure-JVM module, even though the runner has an Android SDK.
      - run: ./gradlew :protocol:test -Pcarheadsup.app=false
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-reports
          path: companion-android/protocol/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  android-app:
    name: Android app build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: companion-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carheadsup-companion-debug-apk
          path: companion-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: companion-android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
